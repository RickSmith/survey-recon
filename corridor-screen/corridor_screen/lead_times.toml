not_found = """
Not found: no Texas statute setting a notice period for entering church land. \
Looked in: Tex. Occ. Code ch. 1071, Tex. Health & Safety Code ch. 711 and \
Tex. Util. Code ch. 251. Access rests on whoever holds authority for the \
congregation, which is commonly a board meeting monthly."""
