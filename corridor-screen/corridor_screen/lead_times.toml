url = "https://statutes.capitol.texas.gov/Docs/PE/htm/PE.30.htm"
verified_on = 2026-09-12
not_found = """
Not found, and not findable: no notice period exists to look for, and no public \
source publishes gate locations or livestock. This is the not-screenable gap \
named in specification section 12 \
and in every output this tool writes. It is listed here so the row is visible \
rather than absent."""
note = """
A tool that says "I cannot see this, you must" is more use than one that \
