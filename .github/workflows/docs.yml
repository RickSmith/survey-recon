# Builds the documentation site and puts it on the web.
#
# On a push to main it publishes. On a pull request it builds but does not
# publish, so a broken page gets caught on the check print rather than live.

name: Publish the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# What this workflow is allowed to touch. Read the code, write the web pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes of the same branch overlap, and never cancel one
# half-way - a canceled publish can leave the live site in pieces.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Step 1. Render the slide deck. This is the other workflow in this folder.
  slides:
    uses: ./.github/workflows/slides.yml

  # Step 2. Build the site, and drop the rendered deck inside it.
  build:
    runs-on: ubuntu-latest
    needs: slides

    steps:
      - name: Fetch the repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the site builder
        run: pip install -r requirements-docs.txt

      # --strict turns every warning into a failure. A link that points at a
      # page which does not exist stops the build here instead of becoming a
      # 404 that somebody finds from the stage.
      - name: Build the site
        run: mkdocs build --strict

      - name: Collect the rendered deck
        uses: actions/download-artifact@v4
        with:
          name: slides
          path: site/slides

      # The Slides page links to these two by hand, so nothing else would
      # notice if a filename drifted. This is what notices.
      - name: Check the deck landed where the Slides page points
        run: |
          test -s site/slides/deck.html
          test -s site/slides/beyond-the-prompt.pdf

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Step 3. Publish - but only from main. Pull requests stop after step 2.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Put it on the web
        id: deployment
        uses: actions/deploy-pages@v4
