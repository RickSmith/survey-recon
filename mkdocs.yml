# ---------------------------------------------------------------------------
# How the site looks
# ---------------------------------------------------------------------------

theme:
  name: material

  features:
    - navigation.top         # a "back to top" button
    - navigation.footer      # previous / next links at the bottom
    - content.action.edit    # the edit pencil
    - search.highlight       # highlight the words you searched for
    - toc.follow             # the right-hand outline tracks where you are

  # Two color schemes and a switch in the header to move between them.
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

plugins:
  - search                   # the search box in the header


# ---------------------------------------------------------------------------
# Extra markdown features these pages use
# ---------------------------------------------------------------------------
#
# Plain markdown does not know about colored note boxes or buttons.
# Each line below switches one of those on.

markdown_extensions:
  - admonition               # the "!!! note" boxes
  - attr_list                # lets a link be styled as a button
  - md_in_html               # lets markdown work inside a <div>, for the card grid
  - pymdownx.details         # collapsible boxes
  - pymdownx.superfences     # better code blocks
  - toc:
      permalink: true        # a clickable anchor beside every heading


# ---------------------------------------------------------------------------
# Files inside docs/ that are NOT pages of this site
# ---------------------------------------------------------------------------
#
# The slide deck is markdown too, but it is built by a different tool (Marp)
# into docs/slides/deck.html. Listing it here keeps the site builder from
# also rendering it as an ordinary page.

exclude_docs: |
  slides/beyond-the-prompt.md
  slides/themes/
