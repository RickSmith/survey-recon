      - The NGS datasheets service: data-sources/ngs-datasheets.md
      - The TxDOT ROW map sheet index: data-sources/row-map-sheets.md
  - Toolkit: toolkit/index.md
  - Governance:
      - governance/index.md
      - A firm AI-use policy: governance/ai-use-policy.md
      - What never leaves the office: governance/what-never-leaves.md
      - The seal and responsible charge: governance/seal-and-responsible-charge.md
  - Going further: going-further/index.md
  - Slides: slides/index.md
  - How this repo was built:
