# This file is the whole configuration for the documentation site.
#
# If you have never opened a configuration file before: it is a plain text file
# that answers questions. The word before each colon is the question, and what
# follows is the answer. Indentation matters - things indented under a line
# belong to that line. Anything after a "#" is a note to a human and is ignored.
#
# You can read it top to bottom. Nothing here is hidden anywhere else.


# ---------------------------------------------------------------------------
# What the site is called, and where it lives
# ---------------------------------------------------------------------------

site_name: survey-recon
site_description: Reconnaissance for survey work, with an AI agent doing the legwork.
site_author: Rick Smith
site_url: https://ricksmith.github.io/survey-recon/

repo_url: https://github.com/RickSmith/survey-recon
repo_name: RickSmith/survey-recon

# Puts an "edit this page" pencil on every page, pointing at the real file.
edit_uri: edit/main/docs/

copyright: Built for TSPS 2026 &middot; public data only


# ---------------------------------------------------------------------------
# The menu down the left-hand side
# ---------------------------------------------------------------------------
#
# Each line is: the words a reader sees, then the file those words open.
# The order here is the order on the page. Change a line, the menu changes.

nav:
