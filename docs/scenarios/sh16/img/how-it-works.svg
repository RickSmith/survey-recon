<rect x="60" y="190" width="330" height="8" rx="4" fill="#0f766e"/>
<text x="84.0" y="242.0" font-size="26" fill="#111827" font-weight="700" text-anchor="start">1. A centerline</text>
<text x="84.0" y="278.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">TxDOT's own, by route and mile.</text>
<text x="84.0" y="306.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">8.691 miles on this job.</text>
<line x1="390" y1="295" x2="440" y2="295" stroke="#111827" stroke-width="3" marker-end="url(#head)"/>
<rect x="440" y="190" width="330" height="210" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
<rect x="440" y="190" width="330" height="8" rx="4" fill="#0f766e"/>
<text x="464.0" y="242.0" font-size="26" fill="#111827" font-weight="700" text-anchor="start">2. A ribbon</text>
<text x="464.0" y="278.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">300 feet either side.</text>
<text x="464.0" y="306.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">The ground the job touches.</text>
<line x1="770" y1="295" x2="820" y2="295" stroke="#111827" stroke-width="3" marker-end="url(#head)"/>
<rect x="820" y="190" width="400" height="210" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
<rect x="820" y="190" width="400" height="8" rx="4" fill="#0f766e"/>
<text x="844.0" y="242.0" font-size="26" fill="#111827" font-weight="700" text-anchor="start">3. Public services asked</text>
<text x="844.0" y="278.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">14 of them, in a fixed order.</text>
<text x="844.0" y="306.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">Every answer saved with its date</text>
<text x="844.0" y="334.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">and the exact request.</text>
<line x1="1220" y1="295" x2="1270" y2="295" stroke="#111827" stroke-width="3" marker-end="url(#head)"/>
<rect x="1270" y="190" width="330" height="210" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
<rect x="1270" y="190" width="330" height="8" rx="4" fill="#0f766e"/>
<text x="1294.0" y="242.0" font-size="26" fill="#111827" font-weight="700" text-anchor="start">4. One file</text>
<text x="1294.0" y="278.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">screening.json.</text>
<text x="1294.0" y="306.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">Every answer, and every</text>
<text x="1294.0" y="334.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">question nobody could answer.</text>
<line x1="1435" y1="400" x2="1435" y2="450" stroke="#111827" stroke-width="3" marker-end="url(#head)"/>
<text x="60.0" y="440.0" font-size="24" fill="#111827" font-weight="700" text-anchor="start">The services, by what they were asked for</text>
