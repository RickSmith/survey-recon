<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="60.0" y="78.0" font-size="44" fill="#111827" font-weight="700" text-anchor="start">How the screening works</text>
<text x="60.0" y="122.0" font-size="26" fill="#4b5563" font-weight="400" text-anchor="start">One line goes in. One file comes out. Three documents are written from it, and a licensed surveyor reads them.</text>
<defs><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#111827"/></marker></defs>
