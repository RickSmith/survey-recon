<text x="1294.0" y="582.0" font-size="26" fill="#111827" font-weight="700" text-anchor="start">5. Three documents</text>
<text x="1294.0" y="618.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">The bid memo.</text>
<text x="1294.0" y="646.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">The flagged parcel table.</text>
<text x="1294.0" y="674.0" font-size="20" fill="#4b5563" font-weight="400" text-anchor="start">The crew-day build-up.</text>
